<h2 class="text-center my-4">Crear Chiste</h2>

<div *ngIf="errorMsg" class="alert alert-danger text-center">
  {{ errorMsg }}
</div>

<form (ngSubmit)="createJoke()" class="p-4 shadow-sm bg-light rounded">
  <!-- Categoría -->
  <div class="mb-3">
    <label for="categoryId" class="form-label fw-bold">Categoría</label>
    <select 
      id="categoryId" 
      [(ngModel)]="joke.categoryId" 
      name="categoryId" 
      class="form-select"
      required
    >
      <option [ngValue]="null" disabled>Seleccione una categoría</option>
      <option *ngFor="let cat of categories" [ngValue]="cat.id">
        {{ cat.name }}
      </option>
    </select>
  </div>

  <!-- Idioma -->
  <div class="mb-3">
    <label for="languageId" class="form-label fw-bold">Idioma</label>
    <select 
      id="languageId" 
      [(ngModel)]="joke.languageId" 
      name="languageId" 
      class="form-select"
      required
    >
      <option [ngValue]="null" disabled>Seleccione un idioma</option>
      <option *ngFor="let lang of languages" [ngValue]="lang.id">
        {{ lang.name }}
      </option>
    </select>
  </div>

  <!-- Tipo -->
  <div class="mb-3">
    <label for="typeId" class="form-label fw-bold">Tipo</label>
    <select 
      id="typeId" 
      [(ngModel)]="joke.typeId" 
      name="typeId" 
      class="form-select"
      (change)="joke.typeId === 1 ? joke.text2 = '' : null"
      required
    >
      <option [ngValue]="null" disabled>Seleccione un tipo</option>
      <option *ngFor="let t of types" [ngValue]="t.id">
        {{ t.name }}
      </option>
    </select>
  </div>

  <!-- Flags -->
  <div class="mb-3">
    <label class="form-label fw-bold">Flags</label>
    <div class="flags-container">
      <div class="form-check" *ngFor="let flag of flags">
        <input
          type="checkbox"
          class="form-check-input"
          [checked]="flag.selected"
          (change)="checkboxChanged($event, flag)"
          [id]="'flag-' + flag.id"
        />
        <label class="form-check-label" [for]="'flag-' + flag.id">
          {{ flag.name }}
        </label>
      </div>
    </div>
  </div>

  <!-- Text1 -->
  <div class="mb-3">
    <label for="text1" class="form-label fw-bold">Text1</label>
    <input
      id="text1"
      type="text"
      [(ngModel)]="joke.text1"
      name="text1"
      class="form-control"
      required
    />
  </div>

  <!-- Text2 (Solo aparece si typeId es 2) -->
  <div class="mb-3" *ngIf="joke.typeId === 2">
    <label for="text2" class="form-label fw-bold">Text2</label>
    <input
      id="text2"
      type="text"
      [(ngModel)]="joke.text2"
      name="text2"
      class="form-control"
      required
    />
  </div>

  <div class="d-flex justify-content-center">
    <button type="submit" class="btn btn-primary px-4">Guardar</button>
    <button
      type="button"
      class="btn btn-secondary ms-2 px-4"
      [routerLink]="['/jokes']"
    >
      Cancelar
    </button>
  </div>
</form>
