<h2>Listado de Categorías</h2>

<div *ngIf="errorMsg" class="alert alert-danger">
  {{ errorMsg }}
</div>

<button [routerLink]="['/categories/create']" class="btn btn-primary mb-3">
  Crear Nueva Categoría
</button>

<table class="table table-striped mt-3">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let category of categories">
      <td>{{ category.id }}</td>
      <td>{{ category.name }}</td>
      <td>
        <div class="action-buttons">
          <a class="btn btn-info btn-sm" [routerLink]="['/categories/detail', category.id]">Ver</a>
          <a class="btn btn-warning btn-sm" [routerLink]="['/categories/edit', category.id]">Editar</a>
          <button class="btn btn-danger btn-sm" (click)="deleteCategoryWithJokes(category.id)">Eliminar con chistes</button>
          <button class="btn btn-danger btn-sm" (click)="removeCategoryFromJokes(category.id)">Eliminar sin chistes</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
